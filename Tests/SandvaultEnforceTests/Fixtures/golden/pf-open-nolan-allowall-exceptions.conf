# Sandvault Config anchor com.apple/sandvault-config, generated by svctl-helper. svctl firewall apply rewrites it.
# Mode open. Rules match the sandbox user's sockets (user 601); pf knows owners of TCP and UDP only.

# netd on loopback: explicit proxy, transparent HTTP and TLS listeners, DNS forwarder.
pass out quick proto { tcp udp } from any to 127.0.0.1 port { 18053 18080 18081 18443 18444 } user 601 keep state

# Exceptions (svctl firewall except): explicit grants, evaluated before the guards below.
# exception 00000000-0000-4000-8000-000000000011: ssh to github
pass out quick proto tcp from any to 140.82.112.0/20 port 22 user 601 keep state
# exception 00000000-0000-4000-8000-000000000012: ntp
pass out quick proto udp from any to any port 123 user 601 keep state
# exception 00000000-0000-4000-8000-000000000013
pass out quick proto tcp from any to 2001:db8::10 user 601 keep state

# Localhost (allow-all): every loopback port is reachable.
pass in quick on lo0 proto { tcp udp } from any to any user 601 keep state
pass out quick proto { tcp udp } from any to { 127.0.0.0/8 ::1 } user 601 keep state

# Everything else is allowed in open mode.
pass out quick proto { tcp udp } from any to any user 601 keep state

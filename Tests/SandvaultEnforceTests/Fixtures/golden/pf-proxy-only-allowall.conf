# Sandvault Config anchor com.apple/sandvault-config, generated by svctl-helper. svctl firewall apply rewrites it.
# Mode proxy-only. Rules match the sandbox user's sockets (user 601); pf knows owners of TCP and UDP only.

# Translation: flows re-routed to lo0 below still carry their original destination; hand them to netd.
# Note: this also catches any local user's lo0 packets to this Mac's own non-loopback addresses on these ports.
rdr pass on lo0 inet proto tcp from any to ! 127.0.0.0/8 port 80 -> 127.0.0.1 port 18081
rdr pass on lo0 inet proto tcp from any to ! 127.0.0.0/8 port 443 -> 127.0.0.1 port 18443
rdr pass on lo0 inet proto { tcp udp } from any to ! 127.0.0.0/8 port 53 -> 127.0.0.1 port 18053

# Re-route HTTP, HTTPS and DNS of the sandbox user to lo0 (IPv4; IPv6 is refused below and clients fall back).
pass out quick on ! lo0 route-to (lo0 127.0.0.1) inet proto tcp from any to any port { 53 80 443 } user 601 keep state
pass out quick on ! lo0 route-to (lo0 127.0.0.1) inet proto udp from any to any port 53 user 601 keep state
# A re-routed packet is evaluated again as "out on lo0" with its original destination: let it through.
pass out quick on lo0 inet proto tcp from any to ! 127.0.0.0/8 port { 53 80 443 } user 601 keep state
pass out quick on lo0 inet proto udp from any to ! 127.0.0.0/8 port 53 user 601 keep state

# netd on loopback: explicit proxy, transparent HTTP and TLS listeners, DNS forwarder.
pass out quick proto { tcp udp } from any to 127.0.0.1 port { 18053 18080 18081 18443 18444 } user 601 keep state

# Localhost (allow-all): every loopback port is reachable.
pass in quick on lo0 proto { tcp udp } from any to any user 601 keep state
pass out quick proto { tcp udp } from any to { 127.0.0.0/8 ::1 } user 601 keep state

# Everything else of the sandbox user is refused (IPv4 and IPv6).
block return out log quick proto { tcp udp } from any to any user 601
